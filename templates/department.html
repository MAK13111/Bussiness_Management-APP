<div id="departments-main-panel" class="main-panel" style="display:none;">
  <div id="departments-panel" class="sub-panel active">
    
    <!-- Top Header & Stats Card -->
    <div class="dept-header-card">
      <div class="dept-header-info">
        <div class="dept-header-icon">
          <i class="ti ti-building-store"></i>
        </div>
        <div>
          <div class="dept-header-title">Department Management</div>
          <div class="dept-header-subtitle">Organize products into categories for easy filtering &amp; inventory tracking</div>
        </div>
      </div>
      <div class="dept-stats-badge">
        <span class="dept-stats-num" id="dept-total-count">0</span>
        <span class="dept-stats-label">Departments</span>
      </div>
    </div>

    <!-- Actions Bar: Search + Add Form -->
    <div class="dept-actions-bar">
      <div class="dept-search-wrap">
        <i class="ti ti-search search-icon"></i>
        <input type="text" id="dept-search-input" placeholder="Search departments..." oninput="filterDepartments(this.value)" autocomplete="off"/>
        <button id="dept-search-clear" onclick="clearDeptSearch()" style="display:none;"><i class="ti ti-x"></i></button>
      </div>

      <div class="dept-add-form">
        <div class="dept-input-wrap">
          <i class="ti ti-tag input-icon"></i>
          <input id="dept-new-input" type="text" placeholder="Enter new department name..." autocomplete="off" onkeydown="if(event.key==='Enter')addDepartment()"/>
        </div>
        <button class="dept-add-btn" onclick="addDepartment()">
          <i class="ti ti-plus"></i> Add Department
        </button>
      </div>
    </div>

    <!-- Departments Grid Container -->
    <div class="dept-grid-container">
      <div id="dept-list" class="dept-cards-grid">
        <div class="dept-loading-placeholder" style="grid-column: 1/-1; text-align:center; padding: 2rem; color:var(--color-text-tertiary);">
          <i class="ti ti-loader spin" style="font-size:24px; display:block; margin-bottom:8px;"></i> Loading departments...
        </div>
      </div>
    </div>

  </div>
</div>
